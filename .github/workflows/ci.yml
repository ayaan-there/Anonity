name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Compact compiler
        run: npm install -g @midnight-ntwrk/compact-compiler

      - name: Compile contracts
        run: |
          compact compile contracts/counter.compact contracts/managed/counter
          npm run compile:veilwork

      - name: Run test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
